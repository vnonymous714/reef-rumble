# Reef Rumble Telegram Stars worker. Enrique's own Cloudflare account only (never Miriam's).
# Secrets (set with `wrangler secret put`, never committed): BOT_TOKEN, WEBHOOK_SECRET, ADMIN_PASS, ADMIN_TOKEN
name = "reef-rumble-tg"
main = "src/index.js"
account_id = "ad444d1dcfb357861f9157b5bc226576"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
GAME_V2 = "1"
GAME_DO_MODE = "on"
GAME_DO_HINT = "enam"
# tg37: DO is the authority between flushes; D1 gets one aggregated flush per ~5 s.
# Rollback without redeploying code: set "off" (dirty journals are flushed first).
GAME_BATCH = "on"
# tg39: game WebSocket at /api/v2/ws (Durable Object Hibernation API).
# "off" = refuse upgrades; every client stays on tg38 HTTP polling (no redeploy of Pages needed).
GAME_WS = "on"
# tg39: who runs the state schedule on an open socket. "server": the DO pushes
# (outgoing messages are free; a pending timer keeps the DO in memory = duration).
# "client": the tab keeps the tg38 schedule and sends each poll over the socket
# (incoming messages billed 20:1, DO can hibernate between messages).
GAME_WS_PUSH = "client"
MINIAPP_URL = "https://vnonymous714.github.io/reef-rumble/?tg=1"
ALLOWED_ORIGIN = "https://vnonymous714.github.io"
TG_API = "https://api.telegram.org"

[[d1_databases]]
binding = "DB"
database_name = "reef-rumble"
database_id = "491b8a78-d907-445e-bef6-83f7ec944f96"
migrations_dir = "migrations"


# Free-plan SQLite Durable Objects only (no key-value backend, no plan upgrade).
[[durable_objects.bindings]]
name = "PLAYER_GAME"
class_name = "PlayerGame"

[[migrations]]
tag = "v1-player-game"
new_sqlite_classes = ["PlayerGame"]
